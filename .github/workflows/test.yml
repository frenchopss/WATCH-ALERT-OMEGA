name: Watch Alerts V1 (Vinted)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: watch-alerts-v1
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore seen.json cache
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: watch-alert-seen-v1-${{ github.run_id }}
          restore-keys: |
            watch-alert-seen-v1-

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          WEBHOOK_OMEGA: ${{ secrets.WEBHOOK_OMEGA }}
          WEBHOOK_TISSOT: ${{ secrets.WEBHOOK_TISSOT }}
          WEBHOOK_LONGINES: ${{ secrets.WEBHOOK_LONGINES }}
          WEBHOOK_MIDO: ${{ secrets.WEBHOOK_MIDO }}
          WEBHOOK_FC: ${{ secrets.WEBHOOK_FC }}
        run: python bot.py

      - name: Save seen.json cache
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: watch-alert-seen-v1-${{ github.run_id }}